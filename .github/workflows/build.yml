name: Build QuickPalette

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      # Static runtime (/MT): the exe needs NOTHING installed on your PC.
      - name: Compile
        shell: cmd
        run: cl /nologo /utf-8 /std:c++17 /O1 /GL /MT /EHsc /DUNICODE /D_UNICODE main.cpp /Fe:QuickPalette.exe /link /SUBSYSTEM:WINDOWS /OPT:REF /OPT:ICF /LTCG

      - uses: actions/upload-artifact@v4
        with:
          name: QuickPalette
          path: QuickPalette.exe
