name: Build QuickPalette

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      # Microsoft's WebView2 SDK (headers + a static loader library) for the built-in browser.
      # If this step fails the app still builds, just without the browser.
      - name: Get WebView2 SDK
        shell: pwsh
        continue-on-error: true
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory packages -NonInteractive
          $d = (Get-ChildItem packages -Directory -Filter 'Microsoft.Web.WebView2.*' | Select-Object -First 1).FullName
          if ($d) { "WV2=$d" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8; Write-Host "WebView2 SDK: $d" }
          else { Write-Host "WebView2 SDK: NOT FOUND (building without the browser)" }

      - name: Compile resources (icon, version info, manifest)
        shell: cmd
        run: rc /nologo app.rc

      # Static runtime (/MT): nothing needs to be installed except (for the browser only) Edge's WebView2 Runtime.
      - name: Compile
        shell: pwsh
        run: |
          $inc = @(); $lib = @()
          if ($env:WV2) {
            $inc += "/I$env:WV2\build\native\include"
            $lib += "$env:WV2\build\native\x64\WebView2LoaderStatic.lib"
            Write-Host "Building WITH the built-in browser"
          } else { Write-Host "Building WITHOUT the built-in browser" }
          cl /nologo /utf-8 /std:c++17 /O1 /GL /MT /EHsc /guard:cf /DUNICODE /D_UNICODE $inc main.cpp app.res /Fe:QuickPalette.exe /link /SUBSYSTEM:WINDOWS /MANIFEST:NO /OPT:REF /OPT:ICF /LTCG /GUARD:CF /DYNAMICBASE /NXCOMPAT /HIGHENTROPYVA $lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: SHA-256 of the exe
        shell: pwsh
        run: Get-FileHash QuickPalette.exe -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: QuickPalette
          path: QuickPalette.exe
